
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BINGO ROYAL</title>
<style>
body{background:#101010;color:white;font-family:Arial;text-align:center;margin:0}
header{padding:20px;background:#191919;border-bottom:2px solid #d4af37}
h1,h2{color:#d4af37}
.card{background:#202020;border:1px solid #d4af37;border-radius:15px;padding:15px;margin:20px auto;max-width:420px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.cell{background:#333;padding:16px 0;border:1px solid #b28b35;border-radius:7px;font-size:18px}
.marked{background:#d4af37;color:black}
.head{color:#d4af37;font-weight:bold;font-size:22px}
button{background:#d4af37;border:0;padding:13px 20px;border-radius:8px;margin:8px;font-weight:bold;font-size:16px}
.number{font-size:45px;color:#d4af37;padding:15px}
</style>
</head>
<body>
<header><h1>♛ BINGO ROYAL ♛</h1><p>عالم البينغو الملكي</p></header>
<div class="card">
<h2>بطاقة اللعب</h2>
<div class="grid head"><div>B</div><div>I</div><div>N</div><div>G</div><div>O</div></div>
<div class="grid" id="board"></div>
<p id="status">حظاً سعيداً!</p>
<button onclick="newGame()">لعبة جديدة</button>
<button onclick="checkWin()">تحقق من الفوز</button>
</div>
<div class="card">
<h2>الرقم المسحوب</h2>
<div class="number" id="number">---</div>
<button onclick="drawNumber()">اسحب رقماً</button>
<p id="count">الأرقام المسحوبة: 0</p>
</div>
<script>
let card=[],drawn=[],marked=[];
function newGame(){
drawn=[];marked=[];card=[];
for(let c=0;c<5;c++){
let nums=[],min=c*15+1;
while(nums.length<5){
let n=Math.floor(Math.random()*15)+min;
if(!nums.includes(n))nums.push(n);
}
card.push(nums);
}
card[2][2]="FREE";
document.getElementById("number").textContent="---";
render();
update();
}
function render(){
let board=document.getElementById("board");
board.innerHTML="";
for(let r=0;r<5;r++)for(let c=0;c<5;c++){
let v=card[c][r],d=document.createElement("div");
d.className="cell";
d.textContent=v;
if(v==="FREE"||marked.includes(v))d.classList.add("marked");
d.onclick=()=>{
if(v!=="FREE"){
marked.includes(v)?marked=marked.filter(x=>x!==v):marked.push(v);
render();
}
};
board.appendChild(d);
}
}
function drawNumber(){
if(drawn.length>=75)return;
let n;
do{n=Math.floor(Math.random()*75)+1}while(drawn.includes(n));
drawn.push(n);
let letter=n<=15?"B":n<=30?"I":n<=45?"N":n<=60?"G":"O";
document.getElementById("number").textContent=letter+" - "+n;
update();
}
function update(){
document.getElementById("count").textContent="الأرقام المسحوبة: "+drawn.length;
}
function checkWin(){
let win=false;
for(let r=0;r<5;r++){
if(card.every((col,c)=>col[r]==="FREE"||marked.includes(col[r])))win=true;
}
for(let c=0;c<5;c++){
if(card[c].every(v=>v==="FREE"||marked.includes(v)))win=true;
}
if(win)document.getElementById("status").textContent="🎉 BINGO! لقد فزت!";
else document.getElementById("status").textContent="لم تكتمل بطاقة الفوز بعد";
}
newGame();
</script>
</body>
</html>
